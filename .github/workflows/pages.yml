name: Deploy samples to Pages

on:
  push:
    branches: [main]
    paths:
      - 'samples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN に Pages デプロイの権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に1つだけ。実行中のものはキャンセルしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # サンプルが増えたら samples/<名前> を足すだけで済むよう、
      # samples/*/package.json を持つディレクトリを総なめしてサブパスへ配置する。
      # 公開URL: https://<owner>.github.io/<repo>/<サンプル名>/
      - name: Build samples
        run: |
          set -euo pipefail
          mkdir -p _site
          for pkg in samples/*/package.json; do
            dir="$(dirname "$pkg")"
            name="$(basename "$dir")"
            echo "::group::build ${name}"
            npm ci --prefix "$dir"
            npm run build --prefix "$dir"
            if [ ! -d "${dir}/dist" ]; then
              echo "${dir}/dist がありません" >&2
              exit 1
            fi
            mkdir -p "_site/${name}"
            cp -R "${dir}/dist/." "_site/${name}/"
            echo "::endgroup::"
          done
          ls -R _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
