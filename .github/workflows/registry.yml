name: Build registry

on:
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Issue由来の文字列（title / body など）は run: に一切展開しない。
      # スクリプトがGitHub APIから直接取得し、Node内だけで処理する。
      - name: Build registry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-registry.mjs

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- registry.json; then
            echo "registry.json に差分はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: registry.json を更新"
          git push
